[general]
description = Crawford (AR-M2V4D), CAN with general TRT GMMs VS30s=180 OQT_MODE=CLASSICAL OQT_SIG=96ed6f3f0f60c930.
calculation_mode = classical
random_seed = 23
concurrent_tasks = 16

[site_params]
reference_vs30_type = inferred
reference_vs30_value = 180
reference_depth_to_1pt0km_per_sec = 514.022
reference_depth_to_2pt5km_per_sec = 0.695

[geometry]
# sites = LON LAT
sites = -81.3406 48.7949
[logic_tree]
# -----------------------------------------------------------------
# Logic-tree path accounting (computed from XML)
#   SMLT (sources) = ssmLT_CAN.xml
#     N_smlt_paths = 6
#     TRTs = ASC, SCC, SIF, SIS30, SIS55
#   GSIM LT (GMPE) = gmmLT_GMM.xml
#     N_gsim_paths = 48000
#     Included = ASC=8, SCC=6, SIF=10, SIS30=10, SIS55=10
#   p = N_smlt_paths * N_gsim_paths = 288000 potential paths
#
# Notes:
# - classical: number_of_logic_tree_samples = 0 => full enumeration
#              (requires max_potential_paths >= p)
# - classical: number_of_logic_tree_samples > 0 => sampling
#              (N >= p => oversampling/duplicates; see oversampling=forbid)
# - event_based: number_of_logic_tree_samples must be < 65,536 (2**16)
#                (classical has no such cap)
# - for huge p: prefer sampling (N << p)
# -----------------------------------------------------------------
number_of_logic_tree_samples = 25000

[erf]
rupture_mesh_spacing = 2
complex_fault_mesh_spacing = 10
width_of_mfd_bin = 0.1
area_source_discretization = 5

[calculation]
source_model_logic_tree_file = ssmLT_CAN.xml
gsim_logic_tree_file = gmmLT_GMM.xml
minimum_magnitude = 4.5
investigation_time = 50
intensity_measure_types_and_levels = {
    "PGA"      : logscale(1e-05, 5, 40),
    "SA(0.05)" : logscale(1e-05, 5, 40),
    "SA(0.075)": logscale(1e-05, 5, 40),
    "SA(0.10)" : logscale(1e-05, 5, 40),
    "SA(0.12)" : logscale(1e-05, 5, 40),
    "SA(0.15)" : logscale(1e-05, 5, 40),
    "SA(0.18)" : logscale(1e-05, 5, 40),
    "SA(0.20)" : logscale(1e-05, 5, 40),
    "SA(0.22)" : logscale(1e-05, 5, 40),
    "SA(0.25)" : logscale(1e-05, 5, 40),
    "SA(0.28)" : logscale(1e-05, 5, 40),
    "SA(0.30)" : logscale(1e-05, 5, 40),
    "SA(0.35)" : logscale(1e-05, 5, 40),
    "SA(0.40)" : logscale(1e-05, 5, 40),
    "SA(0.45)" : logscale(1e-05, 5, 40),
    "SA(0.50)" : logscale(1e-05, 5, 40),
    "SA(0.60)" : logscale(1e-05, 5, 40),
    "SA(0.70)" : logscale(1e-05, 5, 40),
    "SA(0.75)" : logscale(1e-05, 5, 40),
    "SA(0.85)" : logscale(1e-05, 5, 40),
    "SA(0.90)" : logscale(1e-05, 5, 40),
    "SA(1.00)" : logscale(1e-05, 5, 40),
    "SA(1.25)" : logscale(1e-05, 5, 40),
    "SA(1.50)" : logscale(1e-05, 5, 40),
    "SA(1.75)" : logscale(1e-05, 5, 40),
    "SA(2.00)" : logscale(1e-05, 5, 40),
    "SA(2.50)" : logscale(1e-05, 5, 40),
    "SA(3.00)" : logscale(1e-05, 5, 40),
    "SA(3.50)" : logscale(1e-05, 5, 40),
    "SA(4.00)" : logscale(1e-05, 5, 40),
    "SA(4.50)" : logscale(1e-05, 5, 40),
    "SA(5.00)" : logscale(1e-05, 5, 40)}
maximum_distance = {'default': 1000.}
truncation_level = 3

[output]
mean = true
std = false
individual_curves = false
hazard_maps = false
uniform_hazard_spectra = true
